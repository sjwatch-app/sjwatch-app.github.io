<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SJ watch</title>
<meta name="apple-mobile-web-app-title" content="SJ watch">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2B1D14">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #2B1D14; color: #F4E6CB; font-family: -apple-system, Tahoma, sans-serif; }
  .box { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  h1 { color: #E6C98F; font-size: 24px; margin: 18px 0 6px; }
  p { margin: 6px 0; line-height: 1.6; }
  a.btn { display: inline-block; margin-top: 18px; background: #C9A25A; color: #2B1D14; font-weight: 700; padding: 14px 28px; border-radius: 14px; text-decoration: none; font-size: 17px; }
  .how { background: #3A2A1D; border: 1px solid #C9A25A; border-radius: 14px; padding: 14px 18px; margin-top: 20px; text-align: left; max-width: 340px; }
  .k { background: #C9A25A; color: #2B1D14; border-radius: 6px; padding: 0 6px; font-weight: 700; }
</style>
</head>
<body>
<div class="box">
  <img src="apple-touch-icon.png" alt="SJ">
  <h1>SJ watch</h1>
  <p id="msg">กำลังเปิดแอป…</p>
  <a class="btn" id="go" href="https://script.google.com/macros/s/AKfycbyzf64i8oH7y-b9jwxBnDMnDQ5WmCPdtb38j4274-7vypeX5LKxCDokgAOG_TjLc7sZ/exec">เปิดแอป</a>
  <div class="how" id="how" style="display:none">
    <b>เพิ่มไอคอนไว้หน้าจอโฮม (ทำครั้งเดียว)</b>
    <p>1. แตะปุ่มแชร์ <span class="k">⬆</span></p>
    <p>2. แตะ <span class="k">เพิ่มไปยังหน้าจอโฮม</span></p>
    <p>3. เปิด <span class="k">เปิดเป็นเว็บแอป</span> → แตะ <span class="k">เพิ่ม</span></p>
    <p>4. ต่อไปแตะไอคอน SJ ที่หน้าจอโฮม</p>
  </div>
</div>
<script>
  // เปิดจากไอคอนหน้าจอโฮม → เข้าแอปทันที · เปิดใน Safari ปกติ → แสดงวิธีเพิ่มไอคอน (ไม่พาออกจากหน้านี้ ไม่งั้นจะเพิ่มไอคอนผิดหน้า)
  var standalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (standalone) { location.replace(document.getElementById('go').href); }
  else { document.getElementById('msg').textContent = 'หน้าเปิดแอปของร้าน'; document.getElementById('how').style.display = 'block'; }
</script>
</body>
</html>
